---
# CI for Ruqqus: tests against real PostgreSQL, lint, format check, dependency
# audit.
#
# The test matrix runs on 3.12 and 3.13 because the two crashers this suite
# found were both version-sensitive (hmac.new() lost its implicit digestmod in
# 3.13).  3.14 runs as an allowed failure so a new interpreter surfaces issues
# early without blocking merges.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------
  # Tests
  # ------------------------------------------------------------------
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ruqqus
          POSTGRES_PASSWORD: ruqqus
          POSTGRES_DB: ruqqus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruqqus -d ruqqus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The suite never reads DATABASE_URL from .env; see tests/conftest.py.
      RUQQUS_TEST_DATABASE_URL: postgresql://ruqqus:ruqqus@localhost:5432/ruqqus_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q --color=yes

  # ------------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The ruff.toml rule set is deliberately conservative (real defects only)
      # because ruqqus/ is unlinted 2019-2021 code.  Tightening it is Phase 6.
      - name: ruff check
        run: ruff check .

      # Informational until Phase 6 reformats the tree in one pass.
      - name: ruff format check
        continue-on-error: true
        run: ruff format --check .

  # ------------------------------------------------------------------
  # Dependency audit
  # ------------------------------------------------------------------
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --output pip-audit.txt --format columns || true

      - name: Audit dev dependencies
        run: pip-audit -r requirements-dev.txt --output pip-audit-dev.txt --format columns || true

      - name: Show the report
        run: |
          echo "=== runtime requirements ==="
          cat pip-audit.txt || true
          echo "=== dev requirements ==="
          cat pip-audit-dev.txt || true

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit*.txt
          if-no-files-found: ignore
