[pytest]
testpaths = tests
pythonpath = .

# -ra          show a summary of all non-passing tests (including xfails)
# --strict-markers  typo'd markers are errors, not silently ignored
# xfail_strict  an xfail that starts passing is a FAILURE, so the pinned
#               defects in tests/ cannot rot into silent green
addopts = -ra --strict-markers
xfail_strict = true

# The suite needs a real PostgreSQL (see tests/conftest.py).  Keep the output
# readable: the app logs at ERROR during tests.
log_level = ERROR
